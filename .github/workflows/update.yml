name: Update Houston cash games

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes, all day (GitHub may run a few minutes late)
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write   # save the new readings into the repo
  pages: write      # publish the website
  id-token: write

concurrency:
  group: update-cash
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Read PokerAtlas
        id: scrape
        continue-on-error: true
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
        run: python scraper/scrape.py

      - name: Save readings
        run: |
          git config user.name "cash-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Reading $(TZ=America/Chicago date '+%b %-d %-I:%M %p CT')"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done

      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Flag a failed reading
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "PokerAtlas reading failed - see data/latest.json for why."
          exit 1
